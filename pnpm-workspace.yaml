packages:
  - 'apps/*'
  - 'packages/*'

# pnpm quarantines anything published in the last 24 h as a supply-chain guard.
# The Expo SDK 57 patch set was released the same day this repo was scaffolded,
# so the whole Expo scope is exempted. See docs/decisiones.md, D-010: revisit and
# drop this exemption once the versions have aged.
minimumReleaseAgeExclude:
  - expo
  - 'expo-*'
  - '@expo/*'

allowBuilds:
  # core-js arrives under jsPDF and its postinstall only prints a sponsorship
  # message. Nothing in this repository needs it to run, and the panel uses jsPDF's
  # prebuilt bundle, so it stays off rather than being left for pnpm to ask about.
  core-js: false
  # esbuild fetches its platform binary in a postinstall script. It bundles the
  # Lambdas of apps/functions and never ships in the app or the panel.
  esbuild: true
  unrs-resolver: true
