name: Android build

# Every merge into main leaves behind an APK attached to its run: standalone by
# default, so it runs on a phone with no development server behind it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview arranca solo; development necesita Metro (expo start --dev-client)'
        type: choice
        options: [preview, development]
        default: preview
      architectures:
        description: 'Arquitecturas de Android incluidas en el APK'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a,arm64-v8a
          - armeabi-v7a,arm64-v8a,x86,x86_64
        default: arm64-v8a

# A merge must not cancel the previous one's APK: every commit on main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Needed to publish the APK as a release asset, which is the only way to
  # install it on a phone without a computer in the middle.
  contents: write

jobs:
  android:
    name: Build the APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # workflow_dispatch fills these in; a push falls back to the defaults.
      PROFILE: ${{ inputs.profile || 'preview' }}
      REACT_NATIVE_ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is not tracked: it is generated from app.json on every build.
      - name: Generate the native Android project
        run: pnpm --filter @agora/mobile exec expo prebuild --platform android --no-install --clean

      - name: Build the APK
        working-directory: apps/mobile/android
        run: |
          if [ "$PROFILE" = 'preview' ]; then
            task=':app:assembleRelease'
          else
            task=':app:assembleDebug'
          fi
          # --build-cache reuses task outputs from previous runs through the
          # cache that setup-gradle restores, which is most of the build time.
          ./gradlew "$task" --no-daemon --build-cache \
            -PreactNativeArchitectures="$REACT_NATIVE_ARCHITECTURES"

      - name: Name the APK after the commit it came from
        id: apk
        run: |
          set -euo pipefail
          if [ "$PROFILE" = 'preview' ]; then
            variant=release
          else
            variant=debug
          fi
          source="apps/mobile/android/app/build/outputs/apk/$variant/app-$variant.apk"
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          # The commercial name is still pending, so the APK is named after
          # brand.json rather than after a string written here.
          brand="$(node -p "require('./packages/core/src/brand.json').name")"
          slug="$(node -p "require('./packages/core/src/brand.json').slug")"
          name="$slug-$PROFILE-$version-${GITHUB_SHA:0:7}.apk"
          mkdir -p build-output
          cp "$source" "build-output/$name"
          {
            echo "name=$name"
            echo "path=build-output/$name"
            echo "size=$(du -h "build-output/$name" | cut -f1)"
            echo "version=$version"
            echo "brand=$brand"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90
          # An APK is already compressed; zipping it again only costs time.
          compression-level: 0

      # An Actions artifact arrives as a .zip and needs a logged-in session, which
      # on a phone is unusable. A release asset is a plain .apk URL: open it in
      # the browser, tap, install. The tag is rolling, so the link never changes.
      - name: Publish it where a phone can install it
        if: github.ref == 'refs/heads/main' && env.PROFILE == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest '${{ steps.apk.outputs.path }}' \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title '${{ steps.apk.outputs.brand }} Android — última build' \
            --notes "$(printf '%s\n' \
              'APK autónomo de la última fusión en `main`. No necesita ordenador.' \
              '' \
              "Versión ${{ steps.apk.outputs.version }} · commit \`${GITHUB_SHA:0:7}\` · ${{ steps.apk.outputs.size }} · \`$REACT_NATIVE_ARCHITECTURES\`" \
              '' \
              'Ábrelo desde el navegador del móvil y acepta instalar de orígenes desconocidos.')"

      # The run summary is what someone opens to get the APK onto a phone.
      - name: Explain how to install it
        run: |
          {
            echo "## APK listo para descargar"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Fichero | \`${{ steps.apk.outputs.name }}\` |"
            echo "| Perfil | \`$PROFILE\` |"
            echo "| Versión | ${{ steps.apk.outputs.version }} |"
            echo "| Arquitecturas | \`$REACT_NATIVE_ARCHITECTURES\` |"
            echo "| Tamaño | ${{ steps.apk.outputs.size }} |"
            echo "| Commit | [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo
            if [ "$GITHUB_REF" = 'refs/heads/main' ] && [ "$PROFILE" = 'preview' ]; then
              echo "**Desde el móvil:** [$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/android-latest]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/android-latest) — el \`.apk\` se descarga tal cual y se instala de un toque."
              echo
              echo "**Desde el ordenador:** [artefacto del run](${{ steps.upload.outputs.artifact-url }}), que GitHub entrega dentro de un \`.zip\`."
            else
              echo "**[Descargar el APK](${{ steps.upload.outputs.artifact-url }})**"
              echo
              echo "GitHub lo entrega dentro de un \`.zip\`: hay que descomprimirlo antes de pasarlo al móvil."
            fi
            echo
            echo "### Instalarlo en el móvil"
            echo
            echo "1. Copia el \`.apk\` al teléfono Android y ábrelo."
            echo "2. Android pedirá permitir la instalación de orígenes desconocidos. Es normal: va firmado con la clave de depuración."
            if [ "$PROFILE" = 'preview' ]; then
              echo "3. La app arranca sola: lleva el JavaScript dentro."
            else
              echo "3. Esta build **necesita el servidor de desarrollo**. En el portátil, con el móvil en la misma red:"
              echo
              echo "   \`\`\`bash"
              echo "   pnpm --filter @agora/mobile exec expo start --dev-client"
              echo "   \`\`\`"
              echo
              echo "> ¿Querías una que funcione sola, sin portátil delante? Lanza este workflow a mano con el perfil \`preview\`."
            fi
            echo
            echo "El APK se guarda 90 días. Después hay que volver a lanzar el workflow."
          } >> "$GITHUB_STEP_SUMMARY"
