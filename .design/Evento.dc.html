<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; background: #FAF7F2; color: #1A1A17; -webkit-font-smoothing: antialiased; }

    .row { display: flex; align-items: flex-start; gap: 13px; }
    .rowtext { display: flex; flex-direction: column; gap: 1px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; overflow: hidden">

  <!-- Cabecera de cartel: bloque de color de la categoría -->
  <div style="flex: none; position: relative; height: 232px; background: #6D28D9; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 22px 22px; overflow: hidden">
    <div style="position: absolute; top: -60px; right: -50px; width: 210px; height: 210px; border-radius: 999px; background: rgba(255,255,255,0.09)"></div>
    <div style="position: absolute; bottom: -70px; left: -40px; width: 160px; height: 160px; border-radius: 999px; background: rgba(255,255,255,0.07)"></div>

    <div style="position: absolute; top: 24px; left: 16px; width: 48px; height: 48px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; position: relative">
      <div style="display: flex; align-items: center; gap: 8px">
        <span class="eyebrow" style="color: rgba(255,255,255,0.85)">Cultura</span>
        <div style="width: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.55)"></div>
        <span class="eyebrow" style="color: rgba(255,255,255,0.85)">Destacado</span>
      </div>
      <h1 class="serif" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 1.04; color: #FFFFFF; text-wrap: pretty">Cine a la fresca</h1>

  </div>

  <!-- Datos -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 22px 0 22px; overflow: hidden">

    <div class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 1px"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div class="rowtext">
        <span style="font-size: 17px; font-weight: 700">Viernes, 11 de septiembre</span>
        <span style="font-size: 16px; color: #5C5C55">22:00 – 23:45</span>
      </div>
    </div>

    <div class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 1px"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <div class="rowtext">
        <span style="font-size: 17px; font-weight: 700">Parque de la Encina</span>
        <span style="font-size: 16px; color: #5C5C55">La Zubia</span>
      </div>
    </div>

    <div class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.5a2.8 2.8 0 015.4.9c0 1.9-2.8 2.3-2.8 4M12 17.4h.01"/></svg>
      <div class="rowtext">
        <span style="font-size: 17px; font-weight: 700; color: #1B5E20">Entrada gratuita</span>
        <span style="font-size: 16px; color: #5C5C55">Organiza el Ayuntamiento</span>
      </div>
    </div>

    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #3A3A34; text-wrap: pretty">Proyección al aire libre en el parque. Se recomienda traer silla o manta.</p>

    <!-- Mapa -->
    <div style="height: 118px; border-radius: 12px; border: 1px solid #E4DED2; background: #EDE9DF; position: relative; overflow: hidden">
      <div style="position: absolute; inset: 0; background: linear-gradient(115deg, #E8E4D8 0%, #EFEBE0 45%, #E4E6DA 100%)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 42%; height: 9px; background: #DBD6C6"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: 33%; width: 7px; background: #DBD6C6"></div>
      <div style="position: absolute; left: 56px; top: 58px; width: 92px; height: 44px; border-radius: 6px; background: #D3DCC9"></div>
      <div style="position: absolute; left: 168px; top: 30px; display: flex; flex-direction: column; align-items: center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#6D28D9" stroke="#FFFFFF" stroke-width="1.6"><path d="M12 21.5s7-5.8 7-11.3A7 7 0 105 10.2c0 5.5 7 11.3 7 11.3z"/><circle cx="12" cy="10" r="2.4" fill="#FFFFFF" stroke="none"/></svg>
      </div>
    </div>
  </div>

  <!-- Acciones -->
  <div style="flex: none; background: #FFFFFF; border-top: 1px solid #E4DED2; padding: 14px 20px 22px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 54px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; gap: 9px">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5l-1.4-1.3C5.4 14.5 2.5 11.9 2.5 8.7 2.5 6.1 4.6 4 7.2 4c1.5 0 2.9.7 3.8 1.8L12 6.9l1-1.1C13.9 4.7 15.3 4 16.8 4c2.6 0 4.7 2.1 4.7 4.7 0 3.2-2.9 5.8-8.1 10.5z"/></svg>
      <span style="font-size: 18px; font-weight: 700; color: #FFFFFF">Me interesa</span>
    </div>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; height: 50px; border-radius: 12px; border: 1px solid #D6D0C2; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>
        <span style="font-size: 16px; font-weight: 600">Calendario</span>
      </div>
      <div style="flex: 1; height: 50px; border-radius: 12px; border: 1px solid #D6D0C2; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M12 3l-4 4M12 3l4 4"/><path d="M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>
        <span style="font-size: 16px; font-weight: 600">Compartir</span>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1B5E20","options":["#1B5E20","#0F4C81","#8C2F39","#B45309"],"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1B5E20' };
  }
}
</script>
</body>
</html>
