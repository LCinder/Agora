<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; background: #FAF7F2; color: #1A1A17; -webkit-font-smoothing: antialiased; }
    a { color: #1B5E20; text-decoration: none; } a:hover { color: #14481a; }
    .serif { font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
    .day { height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 10px; font-size: 17px; font-weight: 500; }
    .dots { display: flex; gap: 3px; height: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FAF7F2; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 28px 20px 0 20px">
    <div style="display: flex; align-items: center; gap: 9px">
      <div style="width: 22px; height: 22px; border-radius: 4px; background: {{accent}}"></div>
      <span class="eyebrow" style="color: {{accent}}">La Zubia</span>
    </div>

    <div style="display: flex; gap: 4px; background: #F1ECE2; border-radius: 999px; padding: 4px">
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px">
        <span style="font-size: 16px; font-weight: 600; color: #5C5C55">Lista</span>
      </div>
      <div style="flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(26,26,23,0.10)">
        <span style="font-size: 16px; font-weight: 700">Mes</span>
      </div>
    </div>
  </div>

  <!-- Cabecera del mes -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 16px 10px 16px">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
      <h2 class="serif" style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1">Septiembre</h2>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #5C5C55">2026</span>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <!-- Rejilla -->
  <div style="padding: 0 14px; display: flex; flex-direction: column; gap: 2px">
    <div class="wk" style="margin-bottom: 6px">
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">L</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">M</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">X</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">J</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">V</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">S</div>
      <div style="text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5C5C55">D</div>
    </div>

    <sc-for list="{{weeks}}" as="week" hint-placeholder-count="5">
      <div class="wk">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div class="day" style="{{d.cellStyle}}">
            <span style="{{d.textStyle}}">{{d.n}}</span>
            <div class="dots">
              <sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="2">
                <div class="dot" style="background: {{dot.c}}"></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- Día elegido -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 22px 20px 0 20px; overflow: hidden">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <h3 class="serif" style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Viernes 11</h3>
      <span style="font-size: 14px; color: #5C5C55">2 eventos</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DED2; border-radius: 12px; display: flex; overflow: hidden">
      <div style="width: 6px; background: #A16207; flex: none"></div>
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <span class="eyebrow" style="color: #A16207">Mayores</span>
        <h4 class="serif" style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.15">Taller de cerámica</h4>
        <span style="font-size: 15px; color: #5C5C55"><strong style="color: #1A1A17; font-weight: 700">18:00</strong> · Centro de Mayores</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DED2; border-radius: 12px; display: flex; overflow: hidden">
      <div style="width: 6px; background: #6D28D9; flex: none"></div>
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
        <span class="eyebrow" style="color: #6D28D9">Cultura</span>
        <h4 class="serif" style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.15">Cine a la fresca</h4>
        <span style="font-size: 15px; color: #5C5C55"><strong style="color: #1A1A17; font-weight: 700">22:00</strong> · Parque de la Encina</span>
      </div>
    </div>
  </div>

  <div style="flex: none; display: flex; background: #FFFFFF; border-top: 1px solid #E4DED2; padding: 8px 0 18px 0">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="font-size: 12px; font-weight: 700; color: {{accent}}">Agenda</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C5C55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5l-1.4-1.3C5.4 14.5 2.5 11.9 2.5 8.7 2.5 6.1 4.6 4 7.2 4c1.5 0 2.9.7 3.8 1.8L12 6.9l1-1.1C13.9 4.7 15.3 4 16.8 4c2.6 0 4.7 2.1 4.7 4.7 0 3.2-2.9 5.8-8.1 10.5z"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #5C5C55">Mis eventos</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5C5C55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8 2 2 0 11-2.7 2.7 1.6 1.6 0 00-1.8.3 1.6 1.6 0 00-1 1.5 2 2 0 11-4 0 1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8-.3 2 2 0 11-2.7-2.7 1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1 2 2 0 110-4 1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8 2 2 0 112.7-2.7 1.6 1.6 0 001.8.3 1.6 1.6 0 001-1.5 2 2 0 114 0 1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3 2 2 0 112.7 2.7 1.6 1.6 0 00-.3 1.8 1.6 1.6 0 001.5 1 2 2 0 110 4 1.6 1.6 0 00-1.5 1z"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #5C5C55">Ajustes</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1B5E20","options":["#1B5E20","#0F4C81","#8C2F39","#B45309"],"section":"Marca"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1B5E20';
    const CULTURA = '#6D28D9', DEPORTE = '#047857', INFANTIL = '#0369A1';
    const MAYORES = '#A16207', FIESTAS = '#C2410C';

    // Septiembre de 2026: empieza en martes, 30 días. Hoy es viernes 11.
    const byDay = {
      11: [MAYORES, CULTURA], 12: [INFANTIL], 13: [CULTURA, DEPORTE],
      14: [DEPORTE, CULTURA], 15: [DEPORTE], 16: [CULTURA], 17: [MAYORES],
      19: [DEPORTE], 20: [CULTURA], 23: [CULTURA], 26: [FIESTAS], 27: [FIESTAS],
    };

    const cells = [];
    for (let i = 31; i <= 31; i++) cells.push({ n: i, out: true });
    for (let i = 1; i <= 30; i++) cells.push({ n: i, out: false });
    for (let i = 1; i <= 4; i++) cells.push({ n: i, out: true });

    const weeks = [];
    for (let w = 0; w < 5; w++) {
      weeks.push(
        cells.slice(w * 7, w * 7 + 7).map((cell) => {
          const today = !cell.out && cell.n === 11;
          const dots = cell.out ? [] : (byDay[cell.n] ?? []).slice(0, 3).map((c) => ({ c: today ? '#FFFFFF' : c }));

          return {
            n: cell.n,
            dots,
            cellStyle: today ? `background: ${accent}` : '',
            textStyle: today
              ? 'color: #FFFFFF; font-weight: 800'
              : cell.out
                ? 'color: #726C61'
                : 'color: #1A1A17',
          };
        }),
      );
    }

    return { accent, weeks };
  }
}
</script>
</body>
</html>
