<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; background: #121211; color: #F4F3F0; -webkit-font-smoothing: antialiased; }
    a { color: #E8763C; text-decoration: none; } a:hover { color: #f09a6c; }
    .black { font-family: 'Archivo Black', 'Archivo', system-ui, sans-serif; font-weight: 400; }
    .cat { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .day { height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; border-radius: 10px; font-size: 17px; font-weight: 600; }
    .dots { display: flex; gap: 3px; height: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 999px; }
    .pill { height: 36px; padding: 0 16px; display: flex; align-items: center; border-radius: 999px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #121211; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 30px 20px 0 20px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <span class="cat" style="color: #8A867A">Agenda municipal</span>
        <h1 class="black" style="margin: 0; font-size: 34px; line-height: 0.94; letter-spacing: -0.025em; text-transform: uppercase">La Zubia</h1>
      </div>
      <div class="pill" style="border: 1px solid #35342F; flex: none; height: 40px">
        <span style="font-size: 14px; font-weight: 600; color: #B5B2A8">Cambiar</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: center">
      <div class="pill" style="border: 1px solid #35342F">
        <span style="font-size: 14px; font-weight: 600; color: #B5B2A8">Lista</span>
      </div>
      <div class="pill" style="background: #F4F3F0">
        <span style="font-size: 14px; font-weight: 700; color: #121211">Mes</span>
      </div>
    </div>
  </div>

  <!-- Cabecera del mes -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 24px 16px 12px 16px">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F3F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="display: flex; align-items: baseline; gap: 9px">
      <h2 class="black" style="margin: 0; font-size: 28px; line-height: 1; letter-spacing: -0.03em; text-transform: uppercase">Septiembre</h2>
      <span class="cat" style="color: #8A867A">2026</span>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4F3F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <!-- Rejilla -->
  <div style="padding: 0 14px; display: flex; flex-direction: column; gap: 3px">
    <div class="wk" style="margin-bottom: 6px">
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">L</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">M</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">X</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">J</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">V</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">S</div>
      <div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A867A">D</div>
    </div>

    <sc-for list="{{weeks}}" as="week" hint-placeholder-count="5">
      <div class="wk">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div class="day" style="{{d.cellStyle}}">
            <span style="{{d.textStyle}}">{{d.n}}</span>
            <div class="dots">
              <sc-for list="{{d.dots}}" as="dot" hint-placeholder-count="2">
                <div class="dot" style="background: {{dot.c}}"></div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <!-- Día elegido -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 13px; padding: 24px 20px 0 20px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <span class="cat" style="color: #F4F3F0">Viernes 11</span>
      <div style="flex: 1; height: 1px; background: #26251F"></div>
      <span class="cat" style="color: #8A867A">2 eventos</span>
    </div>

    <div style="display: flex; gap: 14px">
      <div style="position: relative; width: 78px; height: 78px; border-radius: 12px; background: #A16207; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden">
        <svg style="position: absolute; inset: 0" width="78" height="78" aria-hidden="true">
          <defs>
            <pattern id="m-lace" width="26" height="26" patternUnits="userSpaceOnUse">
              <path d="M13 0 L26 13 L13 26 L0 13 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.6"/>
            </pattern>
          </defs>
          <rect width="78" height="78" fill="url(#m-lace)"/>
        </svg>
        <span class="black" style="position: relative; font-size: 20px; color: #FFFFFF; letter-spacing: -0.02em">18:00</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; justify-content: center; flex: 1; min-width: 0">
        <span class="cat" style="color: #D19A2E">Mayores</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.16; letter-spacing: -0.015em">Taller de cerámica</h3>
        <span style="font-size: 15px; color: #8A867A">Centro de Mayores</span>
      </div>
    </div>

    <div style="display: flex; gap: 14px">
      <div style="position: relative; width: 78px; height: 78px; border-radius: 12px; background: #6D28D9; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden">
        <svg style="position: absolute; inset: 0" width="78" height="78" aria-hidden="true">
          <rect width="78" height="78" fill="url(#m-lace)"/>
        </svg>
        <span class="black" style="position: relative; font-size: 20px; color: #FFFFFF; letter-spacing: -0.02em">22:00</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; justify-content: center; flex: 1; min-width: 0">
        <span class="cat" style="color: #A98BE8">Cultura</span>
        <h3 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.16; letter-spacing: -0.015em">Cine a la fresca</h3>
        <span style="font-size: 15px; color: #8A867A">Parque de la Encina</span>
      </div>
    </div>
  </div>

  <div style="flex: none; display: flex; background: #1A1A17; border-top: 1px solid #26251F; padding: 8px 0 18px 0">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F3F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="font-size: 12px; font-weight: 700; color: #F4F3F0">Agenda</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A867A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5l-1.4-1.3C5.4 14.5 2.5 11.9 2.5 8.7 2.5 6.1 4.6 4 7.2 4c1.5 0 2.9.7 3.8 1.8L12 6.9l1-1.1C13.9 4.7 15.3 4 16.8 4c2.6 0 4.7 2.1 4.7 4.7 0 3.2-2.9 5.8-8.1 10.5z"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #8A867A">Mis eventos</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A867A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8 2 2 0 11-2.7 2.7 1.6 1.6 0 00-1.8.3 1.6 1.6 0 00-1 1.5 2 2 0 11-4 0 1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8-.3 2 2 0 11-2.7-2.7 1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1 2 2 0 110-4 1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8 2 2 0 112.7-2.7 1.6 1.6 0 001.8.3 1.6 1.6 0 001-1.5 2 2 0 114 0 1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3 2 2 0 112.7 2.7 1.6 1.6 0 00-.3 1.8 1.6 1.6 0 001.5 1 2 2 0 110 4 1.6 1.6 0 00-1.5 1z"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #8A867A">Ajustes</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const CULTURA = '#A98BE8', DEPORTE = '#34B98A', INFANTIL = '#4CAEEA';
    const MAYORES = '#D19A2E', FIESTAS = '#EE7B48';

    // Septiembre de 2026: empieza en martes, 30 días. Hoy es viernes 11.
    const byDay = {
      11: [MAYORES, CULTURA], 12: [INFANTIL], 13: [CULTURA, DEPORTE],
      14: [DEPORTE, CULTURA], 15: [DEPORTE], 16: [CULTURA], 17: [MAYORES],
      19: [DEPORTE], 20: [CULTURA], 23: [CULTURA], 26: [FIESTAS], 27: [FIESTAS],
    };

    const cells = [{ n: 31, out: true }];
    for (let i = 1; i <= 30; i++) cells.push({ n: i, out: false });
    for (let i = 1; i <= 4; i++) cells.push({ n: i, out: true });

    const weeks = [];
    for (let w = 0; w < 5; w++) {
      weeks.push(
        cells.slice(w * 7, w * 7 + 7).map((cell) => {
          const today = !cell.out && cell.n === 11;
          const dots = cell.out ? [] : (byDay[cell.n] ?? []).slice(0, 3).map((c) => ({ c: today ? '#121211' : c }));

          return {
            n: cell.n,
            dots,
            cellStyle: today ? 'background: #F4F3F0' : '',
            textStyle: today
              ? 'color: #121211; font-weight: 800'
              : cell.out
                ? 'color: #8A867A'
                : 'color: #F4F3F0',
          };
        }),
      );
    }

    return { weeks };
  }
}
</script>
</body>
</html>
